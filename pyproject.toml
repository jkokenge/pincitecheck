[project]
name = "pincitecheck"
version = "0.1.0"
description = "Verify citations in AI-generated legal briefs: case existence, quote/pincite accuracy, and proposition support."
readme = "README.md"
authors = [
    { name = "Joe Kokenge", email = "jkokenge@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pincitecheck = "pincitecheck:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle   F: pyflakes (unused imports, undefined names)
# I: import sorting  B: bugbear (likely bugs)  UP: modern Python syntax
# SIM: simplifications  N: PEP 8 naming
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summarize skips/failures at the end; strict markers catch typos in @pytest.mark
addopts = "-ra --strict-markers"
