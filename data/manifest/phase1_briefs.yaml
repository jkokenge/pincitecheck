# Phase 1 extraction set: 10 public RECAP briefs.
#
# Purpose: ground truth for scoring eyecite citation extraction (ADR 0001).
# These are NOT verified-clean briefs; citation accuracy is not assumed or measured here.
#
# Source: CourtListener RECAP Archive (Free Law Project). Selected 2026-09-27 via the
# REST API v4 search endpoint (type=rd), 23 API calls. PDFs are not committed: they
# download to data/raw/ (gitignored) and are checked against sha256 below. The briefs'
# authors hold copyright in them; the manifest records where to get them, not the text.
#
# Selection criteria:
#   - Text-layer PDFs only, no scans (Phase 1 measures extraction, not OCR).
#   - Coverage of hard citation forms: Id., supra, short cites, string cites, parallel
#     cites, pincite ranges, footnote citations, WL cites, state and specialty reporters.
#   - Spread across courts, circuits, motion types, and filer roles.
#   - Non-sensitive subject matter: no criminal, family, immigration, medical, minors,
#     sealed/redacted filings, or Doe parties.
#
# Coverage:
#   Courts:    CA11, D.D.C., S.D.N.Y. (x2), E.D. Pa., E.D. Va., N.D. Tex., W.D. Tex.,
#              C.D. Cal., N.D. Ga. (circuits: 2, 3, 4, 5, 9, 11, D.C.)
#   Types:     appellate brief, bankruptcy appeal brief, MSJ, MTD (x2), opposition to
#              MTD (x2), claim construction, class certification, opposition to PI
#   Filers:    plaintiffs, defendants, appellants, federal government
#   Pages:     28-75 (400 total)
#
# Known gaps (deliberate or to fill later):
#   - No DOCX. RECAP is PDF-only; convert one brief for the DOCX extraction task and
#     record that it was converted.
#   - No state-court filings (not in RECAP), no scanned PDFs, no pro se briefs.
#   - All filed 2023-2026; older citation habits (e.g., L. Ed. parallels) are sparse.
#
# Fields:
#   features           Why the brief was picked. From a regex screening pass over the
#                      PDF text; indicative only, not ground truth.
#   body_pages         PDF page range to label and to score extractors on: the body only,
#                      excluding cover, contents, table of authorities, signature block,
#                      and certificates (see data/labels/README.md). Inclusive.
#   cl_cited_opinions  Count of opinions CourtListener itself resolved from this
#                      document (search result "cites"). A rough external reference
#                      point for extractor recall, not a label.

